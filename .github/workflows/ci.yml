name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest -q

      - name: Check the correction ledger
        run: uv run python -m tools.cli verify

      - name: Check the audit ledger
        run: uv run python -m tools.cli audit-status --check

      - name: Check the committed edition
        run: uv run python -m tools.cli edition --check

      - name: Check the committed dataset
        run: uv run python -m tools.cli dataset --check
